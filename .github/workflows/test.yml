name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Run local quality suite
        run: make check

      - name: Collect coverage
        run: go test -coverprofile=coverage.out ./...

  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Check generated Registry documentation
        run: make docs-check docs-validate examples-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # Run the same target developers run. The action installs a prebuilt
      # golangci-lint, and a binary built with an older Go than this module
      # targets refuses to load the config. Building it from the pinned
      # toolchain keeps CI and local identical.
      - name: Run golangci-lint
        run: make lint

      - name: Validate GitHub Actions workflows
        run: make actions-check

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Scan Go dependencies and call paths
        run: make vuln

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          args: check

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          args: release --snapshot --clean --skip=sign

      - name: Verify snapshot checksums
        shell: bash
        run: |
          checksum_file=$(find dist -maxdepth 1 -name '*_SHA256SUMS' -print -quit)
          test -n "$checksum_file"
          (cd dist && sha256sum --check "$(basename "$checksum_file")")
