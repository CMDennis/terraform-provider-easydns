name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Run tests and documentation checks
        run: make ci

      - name: Run static and vulnerability analysis
        run: make lint vuln

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          args: check

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Build and sign without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.0
          args: release --clean --skip=publish
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Verify checksums, manifest and signature
        shell: bash
        run: |
          checksum_file=$(find dist -maxdepth 1 -name '*_SHA256SUMS' -print -quit)
          test -n "$checksum_file"
          test -f "${checksum_file}.sig"
          cp terraform-registry-manifest.json "${checksum_file%_SHA256SUMS}_manifest.json"
          grep -q '_manifest\.json$' "$checksum_file"
          (cd dist && sha256sum --check --strict "$(basename "$checksum_file")")
          gpg --verify "${checksum_file}.sig" "$checksum_file"

      - name: Publish the verified release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prefix="dist/terraform-provider-easydns_${RELEASE_TAG#v}"
          flags=(--prerelease=false)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes "See the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/CHANGELOG.md) for this release." \
            "${flags[@]}" \
            "${prefix}"_*.zip \
            "${prefix}_manifest.json" "${prefix}_SHA256SUMS" "${prefix}_SHA256SUMS.sig"
